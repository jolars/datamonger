[project]
name = "Datamonger"

[presentation]
site-url = "https://datamonger.dev/"
canonical-url-style = "clean"
description = "Retrieve, verify, and decode research datasets in Python, R, and Julia."

[presentation.footer]
docs-version = "dev"
links = [
  { label = "GitHub", url = "https://github.com/jolars/datamonger" },
  { label = "Report an issue", url = "https://github.com/jolars/datamonger/issues" },
]
built-with = true

[[repository]]
id = "datamonger"
path = ".."
url = "https://github.com/jolars/datamonger"

[[package]]
id = "python"
name = "Datamonger for Python"
slug = "python"
ecosystem = "python"
repository = "datamonger"
path = "packages/python"
metadata-path = "pyproject.toml"
targets = [{ id = "api", extractor = "python", path = "src/datamonger", role = "public-api" }]

[[package]]
id = "r"
name = "Datamonger for R"
slug = "r"
ecosystem = "r"
repository = "datamonger"
path = "packages/r"
metadata-path = "DESCRIPTION"
targets = [{ id = "api", extractor = "r", path = ".", role = "public-api" }]

[[package]]
id = "julia"
name = "Datamonger for Julia"
slug = "julia"
ecosystem = "julia"
repository = "datamonger"
path = "packages/julia"
metadata-path = "Project.toml"
targets = [{ id = "api", extractor = "julia", path = "src/Datamonger.jl", role = "public-api" }]

[[content]]
id = "guide"
owner = "project"
repository = "datamonger"
path = "documentation/pages"
mount = ""
format = "gfm"

[content.execution]
mode = "never"

[[content]]
id = "python-pages"
owner = "python"
repository = "datamonger"
path = "documentation/package-pages/python"
mount = ""
format = "gfm"

[content.execution]
mode = "never"

[[content]]
id = "r-pages"
owner = "r"
repository = "datamonger"
path = "documentation/package-pages/r"
mount = ""
format = "gfm"

[content.execution]
mode = "never"

[[content]]
id = "julia-pages"
owner = "julia"
repository = "datamonger"
path = "documentation/package-pages/julia"
mount = ""
format = "gfm"

[content.execution]
mode = "never"

[[concept]]
id = "fetch-data"
kind = "equivalent"
members = [
  { package = "python", item = "datamonger.fetch_data" },
  { package = "r", item = "fetch_data" },
  { package = "julia", item = "Datamonger.fetch_data" },
]

