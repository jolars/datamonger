project:
  name: Datamonger
presentation:
  site-url: https://datamonger.dev/
  canonical-url-style: clean
  description: Retrieve, verify, and decode research datasets in Python, R, and Julia.
  home:
    tagline: Datasets, delivered!
    description: Retrieve, verify, and decode public research datasets with consistent values across Python, R, and Julia.
    guide: python.html
    actions:
      - label: Browse datasets
        path: datasets/index.html
      - label: Get started
        path: python.html
    features:
      - title: Find your next dataset
        description: Search the catalog, compare dimensions, and find retrieval examples for your analysis.
        path: datasets/index.html
      - title: Three languages, consistent values
        description: Use Python, R, or Julia with the same registry records and verified decoded values.
        path: r.html
      - title: Reproduce your data access
        description: Record the dataset version and pin the registry to retrieve and verify the same data again.
        path: julia.html
      - title: Retrieve from the command line
        description: Download verified raw artifacts for scripts, pipelines, and tools beyond the language clients.
        path: cli.html
  logo:
    repository: datamonger
    path: assets/logo-large.png
  footer:
    docs-version: dev
    links:
      - label: GitHub
        url: https://github.com/jolars/datamonger
      - label: Report an issue
        url: https://github.com/jolars/datamonger/issues
    built-with: true
repositories:
  - id: datamonger
    path: ..
    url: https://github.com/jolars/datamonger
packages:
  - id: python
    name: Datamonger for Python
    slug: python
    ecosystem: python
    repository: datamonger
    path: packages/python
    metadata-path: pyproject.toml
    targets:
      - id: api
        extractor: python
        path: src/datamonger
        role: public-api
  - id: r
    name: Datamonger for R
    slug: r
    ecosystem: r
    repository: datamonger
    path: packages/r
    metadata-path: DESCRIPTION
    targets:
      - id: api
        extractor: r
        path: .
        role: public-api
  - id: julia
    name: Datamonger for Julia
    slug: julia
    ecosystem: julia
    repository: datamonger
    path: packages/julia
    metadata-path: Project.toml
    targets:
      - id: api
        extractor: julia
        path: src/Datamonger.jl
        role: public-api
content:
  - id: guide
    owner: project
    repository: datamonger
    path: documentation/pages
    mount: ""
    format: gfm
    execution:
      mode: never
  - id: datasets
    owner: project
    repository: datamonger
    path: documentation/generated/datasets
    mount: datasets
    format: gfm
    execution:
      mode: never
  - id: python-pages
    owner: python
    repository: datamonger
    path: documentation/package-pages/python
    mount: ""
    format: gfm
    execution:
      mode: never
  - id: r-pages
    owner: r
    repository: datamonger
    path: documentation/package-pages/r
    mount: ""
    format: gfm
    execution:
      mode: never
  - id: julia-pages
    owner: julia
    repository: datamonger
    path: documentation/package-pages/julia
    mount: ""
    format: gfm
    execution:
      mode: never
  - id: julia-tutorials
    owner: julia
    repository: datamonger
    path: packages/julia/tutorials
    mount: tutorials
    format: gfm
    execution:
      mode: never
concepts:
