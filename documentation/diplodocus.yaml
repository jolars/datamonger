project:
  name: Datamonger
presentation:
  assets:
    - {repository: datamonger, path: documentation/public/apple-touch-icon.png, publish: apple-touch-icon.png}
    - {repository: datamonger, path: documentation/public/catalog.css, publish: catalog.css}
    - {repository: datamonger, path: documentation/public/catalog.js, publish: catalog.js}
    - {repository: datamonger, path: documentation/public/favicon-96x96.png, publish: favicon-96x96.png}
    - {repository: datamonger, path: documentation/public/favicon.ico, publish: favicon.ico}
    - {repository: datamonger, path: documentation/public/favicon.svg, publish: favicon.svg}
    - {repository: datamonger, path: documentation/public/site.webmanifest, publish: site.webmanifest}
    - {repository: datamonger, path: documentation/public/web-app-manifest-192x192.png, publish: web-app-manifest-192x192.png}
    - {repository: datamonger, path: documentation/public/web-app-manifest-512x512.png, publish: web-app-manifest-512x512.png}
  icons:
    - {path: favicon-96x96.png, rel: icon, type: image/png, sizes: 96x96}
    - {path: favicon.svg, rel: icon, type: image/svg+xml}
    - {path: favicon.ico, rel: icon}
    - {path: apple-touch-icon.png, rel: apple-touch-icon}
    - {path: site.webmanifest, rel: manifest}
  site-url: https://datamonger.dev/
  canonical-url-style: clean
  description: Retrieve, verify, and decode research datasets in Python, R, and Julia.
  home:
    tagline: Datasets, delivered!
    description: Retrieve, verify, and decode public research datasets with consistent values across Python, R, and Julia.
    guide: what-is-datamonger.html
    actions:
      - label: What is Datamonger?
        path: what-is-datamonger.html
      - label: Get started
        path: getting-started.html
      - label: Browse datasets
        path: datasets/index.html
    features:
      - title: Dataset metadata and citations
        description: >-
          Search by source, task, or dataset dimensions. Inspect licenses,
          provenance, and citations before downloading data.
      - title: Data frames and sparse matrices
        description: >-
          Load tabular data and sparse features in Python, R, or Julia.
          Datamonger checks that the clients decode the same values and
          preserves registered train and test splits.
      - title: Verified downloads and offline access
        description: >-
          Datamonger checks file sizes and SHA-256 digests on download. Reuse
          cached files offline, or use the CLI to export files in their
          registered format and compression.
      - title: Versioned datasets and registries
        description: >-
          Pin a dataset version and a registry snapshot so you can retrieve and
          verify the same data again.
  sections:
    - {label: Datasets, path: datasets/index.html}
  sidebar:
    - text: Introduction
      items:
        - text: What is Datamonger?
          link: what-is-datamonger.html
        - text: Getting started
          link: getting-started.html
    - text: Reference
      items:
        - text: Command-line reference
          link: cli-reference.html
        - text: Contributing
          link: CONTRIBUTING.html
        - text: Changelog
          link: CHANGELOG.html
  redirects:
    /python: getting-started.html
    /python.html: getting-started.html
    /r: getting-started.html
    /r.html: getting-started.html
    /julia: getting-started.html
    /julia.html: getting-started.html
    /cli: getting-started.html
    /cli.html: getting-started.html
  logo:
    repository: datamonger
    path: assets/logo-large.png
  footer:
    docs-version: dev
    links:
      - label: GitHub
        url: https://github.com/jolars/datamonger
      - label: Report an issue
        url: https://github.com/jolars/datamonger/issues
    built-with: true
repositories:
  - id: datamonger
    path: ..
    url: https://github.com/jolars/datamonger
packages:
  - id: python
    name: Datamonger for Python
    slug: python
    ecosystem: python
    repository: datamonger
    path: packages/python
    metadata-path: pyproject.toml
    targets:
      - id: api
        extractor: python
        path: src/datamonger
        role: public-api
  - id: r
    name: Datamonger for R
    slug: r
    ecosystem: r
    repository: datamonger
    path: packages/r
    metadata-path: DESCRIPTION
    targets:
      - id: api
        extractor: r
        path: .
        role: public-api
  - id: julia
    name: Datamonger for Julia
    slug: julia
    ecosystem: julia
    repository: datamonger
    path: packages/julia
    metadata-path: Project.toml
    targets:
      - id: api
        extractor: julia
        path: src/Datamonger.jl
        role: public-api
content:
  - id: guide
    owner: project
    repository: datamonger
    path: documentation/pages
    mount: ""
    format: gfm
    execution:
      mode: never
  - id: contributing
    owner: project
    repository: datamonger
    path: CONTRIBUTING.md
    mount: ""
    format: gfm
    execution:
      mode: never
  - id: changelog
    owner: project
    repository: datamonger
    path: packages/cli/CHANGELOG.md
    mount: ""
    format: gfm
    execution:
      mode: never
  - id: datasets
    owner: project
    repository: datamonger
    path: documentation/generated/datasets
    mount: datasets
    navigation: none
    format: gfm
    execution:
      mode: never
  - id: python-pages
    owner: python
    repository: datamonger
    path: documentation/package-pages/python
    mount: ""
    format: gfm
    execution:
      mode: never
  - id: r-pages
    owner: r
    repository: datamonger
    path: documentation/package-pages/r
    mount: ""
    format: gfm
    execution:
      mode: never
  - id: julia-pages
    owner: julia
    repository: datamonger
    path: documentation/package-pages/julia
    mount: ""
    format: gfm
    execution:
      mode: never
  - id: julia-tutorials
    owner: julia
    repository: datamonger
    path: packages/julia/tutorials
    mount: tutorials
    format: documenter
    execution:
      mode: execute
      engine: julia
      julia-project: packages/julia/Project.toml
concepts:
