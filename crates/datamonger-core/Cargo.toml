[package]
name = "datamonger-core"
version = "0.2.0"
edition = "2021"
rust-version = "1.82"
authors = ["Johan Larsson"]
license = "MIT"
repository = "https://github.com/jolars/datamonger"
description = "Strict research dataset decoding and canonical verification"
readme = "README.md"
keywords = ["datasets", "reproducibility", "libsvm", "verification"]
categories = ["encoding", "science"]
include = ["src/**", "tests/**", "README.md", "LICENSE", "Cargo.toml", "Cargo.lock"]

[dependencies]
bzip2 = "0.6.1"
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
sha2 = "0.10.9"

[dev-dependencies]
serde_json = "1.0"

[lints.rust]
unsafe_code = "forbid"
