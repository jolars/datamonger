[package]
name = "datamonger-ffi"
version = "0.2.0"
edition = "2021"
rust-version = "1.82"
publish = false
license = "MIT"
description = "C ABI for Datamonger decoding and canonical verification"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
datamonger-core = { version = "0.2.0", path = "../datamonger-core" }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
