name: Python distributions

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit or release tag to build (defaults to the selected branch)
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      ref:
        description: Commit or release tag to build
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  wheels:
    name: Wheel (${{ matrix.platform.target }})
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/python
      - name: Build portable stable ABI wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.15.0
          target: ${{ matrix.platform.target }}
          manylinux: "2014"
          args: >-
            --release --locked --strip --compatibility pypi
            --manifest-path packages/python/Cargo.toml
            --interpreter ${{ runner.os == 'Linux' && 'python3.11' || 'python' }}
            --out wheelhouse
      - name: Check wheel metadata and stable ABI
        shell: bash
        run: |
          python -m pip install abi3audit twine
          python -m abi3audit --strict wheelhouse/*.whl
          python -m twine check wheelhouse/*.whl
      - uses: actions/upload-artifact@v7
        with:
          name: python-wheel-${{ matrix.platform.target }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  test-wheels:
    name: Test wheel (${{ matrix.platform.target }}, Python ${{ matrix.python }})
    needs: wheels
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14", "3.15"]
        platform:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v8
        with:
          name: python-wheel-${{ matrix.platform.target }}
          path: wheelhouse
      - name: Install wheel and test dependencies
        run: |
          uv venv --python '${{ matrix.python }}'
          uv pip install wheelhouse/*.whl pytest hypothesis jsonschema pyyaml
      - name: Test installed distribution
        run: >-
          uv run --no-project --no-sync python -m pytest
          packages/python/tests/test_decoder.py
          packages/python/tests/test_canonical.py
          packages/python/tests/test_conformance.py
          packages/python/tests/test_native.py
          packages/python/tests/test_fetch.py
          packages/python/tests/test_metadata.py
          packages/python/tests/test_cache.py

  sdist:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/python
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.11"
      - name: Build source distribution
        run: uv build --sdist
      - name: Build wheel from source distribution outside checkout
        run: |
          mkdir -p "$RUNNER_TEMP/python-sdist"
          tar -xf dist/*.tar.gz -C "$RUNNER_TEMP/python-sdist"
          uv build --wheel "$RUNNER_TEMP/python-sdist"/* --out-dir dist/from-sdist
      - name: Check distribution metadata
        run: uvx twine check dist/*.tar.gz dist/from-sdist/*.whl
      - uses: actions/upload-artifact@v7
        with:
          name: python-sdist
          path: packages/python/dist/*.tar.gz
          if-no-files-found: error
