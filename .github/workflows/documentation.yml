name: Documentation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check out Diplodocus
        uses: actions/checkout@v7
        with:
          repository: jolars/diplodocus
          ref: c46a7826c67a7ca681fe1544711a769c1e396c46
          path: .build/diplodocus
          persist-credentials: false
      - name: Install Diplodocus Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .build/diplodocus
          key: documentation
      - name: Build Diplodocus
        run: cargo +1.98.0 build --locked --manifest-path .build/diplodocus/Cargo.toml --bin diplodocus
      - name: Check documentation sources
        run: .build/diplodocus/target/debug/diplodocus check --config documentation/diplodocus.toml
      - name: Build documentation site
        run: .build/diplodocus/target/debug/diplodocus build --config documentation/diplodocus.toml --output documentation/site
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: documentation/package-lock.json
      - name: Install Wrangler
        working-directory: documentation
        run: npm ci --ignore-scripts
      - name: Check Worker package
        working-directory: documentation
        run: npx --no-install wrangler deploy --dry-run
      - name: Deploy documentation
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: documentation
        run: npx --no-install wrangler deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
