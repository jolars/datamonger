name: Documentation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check out Diplodocus
        uses: actions/checkout@v7
        with:
          repository: jolars/diplodocus
          ref: 8c79eeae24abf2fceea15886cc66c22a0d4d1d6d
          path: .build/diplodocus
          persist-credentials: false
      - name: Install Diplodocus Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .build/diplodocus
          key: documentation
      - name: Build Diplodocus
        run: cargo +1.98.0 build --locked --manifest-path .build/diplodocus/Cargo.toml --bin diplodocus
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          python-version: "3.11"
      - name: Prepare the Python client
        run: uv sync --locked --project packages/python --no-dev
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.12"
      - name: Prepare the Julia client
        run: julia --project=packages/julia -e 'using Pkg; Pkg.instantiate()'
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: packages/r
          extra-packages: |
            any::pkgload
            any::evaluate
            any::knitr
      - name: Compile the R client
        run: |
          mkdir -p "$RUNNER_TEMP/datamonger-r"
          R CMD INSTALL --library="$RUNNER_TEMP/datamonger-r" packages/r
      - name: Build documentation site
        run: uv run --no-sync --project packages/python .build/diplodocus/target/debug/diplodocus build --config documentation/diplodocus.toml --output documentation/site
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: documentation/package-lock.json
      - name: Install Wrangler
        working-directory: documentation
        run: npm ci --ignore-scripts
      - name: Check Worker package
        working-directory: documentation
        run: npx --no-install wrangler deploy --dry-run
      - name: Deploy documentation
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: documentation
        run: npx --no-install wrangler deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
