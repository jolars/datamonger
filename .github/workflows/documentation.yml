name: Documentation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Diplodocus
        uses: jolars/setup-diplodocus@c24f7f8cac71f80beab04350ac6b98062612345c # v1.0.0
        with:
          # Remove after the action releases its pinned default CLI version.
          version: "0.5.0"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: "3.11"
      - name: Prepare the Python client
        run: uv sync --locked --project packages/python
      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.12"
      - name: Build the Julia native library
        run: julia tools/dm_julia_core.jl
      - name: Prepare the Julia client
        run: julia --project=packages/julia -e 'using Pkg; Pkg.instantiate()'
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: packages/r
          extra-packages: |
            any::pkgload
            any::evaluate
            any::knitr
      - name: Compile the R client
        run: |
          mkdir -p "$RUNNER_TEMP/datamonger-r"
          R CMD INSTALL --library="$RUNNER_TEMP/datamonger-r" packages/r
      - name: Generate dataset catalog
        run: uv run --no-sync --project packages/python python tools/dm_catalog.py
      - name: Build documentation site
        run: uv run --no-sync --project packages/python diplodocus build --config documentation/diplodocus.toml --output documentation/site
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: documentation/package-lock.json
      - name: Install website dependencies
        working-directory: documentation
        run: npm ci --ignore-scripts
      - name: Install public assets and shared head markup
        run: python tools/dm_docs.py
      - name: Install test browser
        working-directory: documentation
        run: npx --no-install playwright install --with-deps chromium
      - name: Test dataset browser
        working-directory: documentation
        run: npm run test:catalog
      - name: Check Worker package
        working-directory: documentation
        run: npx --no-install wrangler deploy --dry-run
      - name: Deploy documentation
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: documentation
        run: npx --no-install wrangler deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
