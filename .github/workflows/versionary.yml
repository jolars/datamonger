name: Versionary

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      retry-registration:
        description: Request the pending Julia registration again at its saved commit
        type: boolean
        default: false

concurrency:
  group: versionary-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
    outputs:
      registry_tag: ${{ steps.registry.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Require successful CI for manual retries
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed="$(gh run list --workflow ci.yml --branch main --commit "$GITHUB_SHA" \
            --event push --status success --limit 1 --json databaseId --jq 'length')"
          if [[ "$passed" != 1 ]]; then
            echo "CI must pass on this main commit before retrying release automation." >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - id: versionary
        uses: jolars/versionary@v1
        with:
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Request Julia registration
        if: >-
          steps.versionary.outputs.release_ready == 'true' ||
          (github.event_name == 'workflow_dispatch' && inputs.retry-registration &&
           steps.versionary.outputs.external_release_targets != '[]')
        uses: actions/github-script@v9
        env:
          EXTERNAL_RELEASE_TARGETS: ${{ steps.versionary.outputs.external_release_targets }}
          RETRY_REGISTRATION: ${{ inputs.retry-registration || false }}
        with:
          github-token: ${{ github.token }}
          script: |
            const request = require('./.github/scripts/request-julia-registration.cjs');
            await request({
              github, context, core,
              targets: JSON.parse(process.env.EXTERNAL_RELEASE_TARGETS),
              retry: process.env.RETRY_REGISTRATION === 'true',
            });

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.82.0"

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::rextendr

      - name: Refresh R vendor archives in release PRs
        env:
          REVIEW_REQUESTS: ${{ steps.versionary.outputs.review_requests }}
          RUSTUP_TOOLCHAIN: "1.82.0"
        run: |
          while IFS= read -r branch; do
            git check-ref-format "refs/heads/$branch"
            git fetch origin "refs/heads/$branch"
            git checkout --detach FETCH_HEAD
            if python tools/dm_rust_sources.py --check; then
              continue
            fi
            Rscript -e 'rextendr::vendor_crates("packages/r", overwrite = TRUE, clean = TRUE)'
            python tools/dm_rust_sources.py --record-vendor
            python tools/dm_rust_sources.py --check
            git add packages/r/src/rust/Cargo.lock packages/r/src/rust/vendor.tar.xz \
              packages/r/src/rust/vendor-config.toml packages/r/src/rust/vendor-lock.sha256
            if ! git diff --cached --quiet; then
              git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -m 'chore(r): refresh vendored Rust dependencies'
              git push origin "HEAD:refs/heads/$branch"
            fi
          done < <(jq -r '.[].branch' <<< "$REVIEW_REQUESTS" | sort -u)

      - name: Select registry release work
        id: registry
        env:
          REVIEW_REQUESTS: ${{ steps.versionary.outputs.review_requests }}
          RELEASE_TARGETS: ${{ steps.versionary.outputs.release_targets }}
        run: |
          branch="$(jq -r '.[] | select(.packagePaths == ["registry"]) | .branch' <<< "$REVIEW_REQUESTS")"
          tag="$(jq -r '.[] | select(.path == "registry") | .tag' <<< "$RELEASE_TARGETS")"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Prepare registry snapshot in its release PR
        if: steps.registry.outputs.branch != ''
        env:
          REGISTRY_BRANCH: ${{ steps.registry.outputs.branch }}
        run: |
          git check-ref-format "refs/heads/$REGISTRY_BRANCH"
          git fetch origin "refs/heads/$REGISTRY_BRANCH"
          git checkout --detach FETCH_HEAD
          uv run --project packages/python python tools/dm_registry_release.py prepare
          uv run --project packages/python python tools/dm_registry_release.py check --pending
          git add registry/releases registry/catalog.json registry/latest.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'chore: prepare registry release snapshot'
            git push origin "HEAD:refs/heads/$REGISTRY_BRANCH"
          fi

  publish-registry:
    needs: release
    if: needs.release.outputs.registry_tag != ''
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/publish-registry.yml
    secrets: inherit
    with:
      tag: ${{ needs.release.outputs.registry_tag }}
