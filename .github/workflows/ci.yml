name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Versionary publishes merged release commits after successful main runs.
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  ci-policy:
    runs-on: ubuntu-latest
    outputs:
      run_checks: ${{ steps.policy.outputs.run_checks }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - id: policy
        uses: jolars/versionary@v1
        with:
          command: ci

  release-integrity:
    needs: ci-policy
    if: needs.ci-policy.outputs.run_checks == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Verify release versions and lockfiles
        run: |
          npx --yes versionary@1 verify
          uv lock --check --project packages/python
          for package in crates/datamonger-core crates/datamonger-ffi packages/cli packages/python packages/r/src/rust; do
            cargo metadata --manifest-path "$package/Cargo.toml" --locked --format-version 1 > /dev/null
          done
      - name: Check vendored Rust sources and shared fixtures
        run: |
          python tools/dm_rust_sources.py --check
          diff -r tests/conformance packages/r/tests/testthat/fixtures/conformance
          diff -r tests/conformance packages/julia/test/fixtures/conformance
      - name: Check registry snapshots and client bundles
        env:
          REGISTRY_RELEASE_PR: ${{ startsWith(github.head_ref, 'versionary/release-registry-') }}
        run: |
          uv sync --locked --no-install-project --project packages/python
          if [[ "$REGISTRY_RELEASE_PR" == true ]]; then
            uv run --no-sync --project packages/python python tools/dm_registry_release.py check --pending
          fi
          uv run --no-sync --project packages/python python tools/dm_bundle_registry.py --check

  yaml-formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Check YAML formatting
        run: npx --yes prettier@3.9.6 --check '.github/**/*.yml' '.github/**/*.yaml' devenv.yaml --no-error-on-unmatched-pattern

  python-distribution-changes:
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.changes.outputs.required }}
      r_vendor_changed: ${{ steps.changes.outputs.r_vendor_changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - name: Check changed paths
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # New branches and unavailable history need the full distribution checks.
          required=true
          r_vendor_changed=true
          if [[ -n "$BASE_SHA" && "$BASE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
              comparison="$BASE_SHA...$HEAD_SHA"
            else
              comparison="$BASE_SHA..$HEAD_SHA"
            fi
            changed="$RUNNER_TEMP/python-distribution-changes"
            # Include both paths of a move so moving Python files out still runs the builds.
            if git diff --no-renames --name-only -z "$comparison" > "$changed"; then
              if git diff --quiet "$comparison" -- packages/r/src/rust; then
                r_vendor_changed=false
              fi
              required=false
              while IFS= read -r -d '' path; do
                case "$path" in
                  packages/python/* | crates/datamonger-core/* | tests/conformance/* | \
                  .cargo/* | .github/actions/* | .gitattributes | .gitignore | \
                  Cargo.toml | Cargo.lock | LICENSE | rust-toolchain.toml | \
                  .github/workflows/ci.yml | .github/workflows/python-wheels.yml | \
                  .github/workflows/publish-python.yml)
                    required=true
                    break
                    ;;
                esac
              done < "$changed"
            fi
          fi
          echo "Python distribution matrix required: $required"
          echo "required=$required" >> "$GITHUB_OUTPUT"
          echo "r_vendor_changed=$r_vendor_changed" >> "$GITHUB_OUTPUT"

  python-distributions:
    needs: [ci-policy, python-distribution-changes]
    if: ${{ !cancelled() && needs.ci-policy.outputs.run_checks != 'false' && needs.python-distribution-changes.outputs.required == 'true' }}
    uses: ./.github/workflows/python-wheels.yml

  python-distributions-status:
    name: Python distributions
    if: always()
    needs: [ci-policy, python-distribution-changes, python-distributions]
    runs-on: ubuntu-latest
    steps:
      - name: Check distribution result
        env:
          CHANGES_RESULT: ${{ needs.python-distribution-changes.result }}
          DISTRIBUTIONS_REQUIRED: ${{ needs.python-distribution-changes.outputs.required }}
          DISTRIBUTIONS_RESULT: ${{ needs.python-distributions.result }}
          POLICY_RESULT: ${{ needs.ci-policy.result }}
          RUN_CHECKS: ${{ needs.ci-policy.outputs.run_checks }}
        run: |
          test "$CHANGES_RESULT" = success
          test "$POLICY_RESULT" = success
          if [[ "$RUN_CHECKS" == false && "$DISTRIBUTIONS_RESULT" == skipped ]]; then
            echo "Versionary release PR; distribution builds will run after merging."
            exit 0
          fi
          case "$DISTRIBUTIONS_REQUIRED:$DISTRIBUTIONS_RESULT" in
            true:success)
              echo "Python distribution builds and tests passed."
              ;;
            false:skipped)
              echo "Python distribution inputs are unchanged; the matrix was skipped."
              ;;
            *)
              echo "Python distribution checks did not succeed." >&2
              exit 1
              ;;
          esac

  core-quality:
    needs: ci-policy
    if: ${{ !cancelled() && needs.ci-policy.outputs.run_checks != 'false' }}
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]
        include:
          - os: ubuntu-latest
            rust: "1.82.0"
    defaults:
      run:
        working-directory: crates/datamonger-core
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/datamonger-core
      - name: Check vendored Rust sources and fixtures
        working-directory: .
        run: python tools/dm_rust_sources.py --check
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Check C ABI crate
        working-directory: crates/datamonger-ffi
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Verify standalone crate package
        run: cargo package --locked

  cli-quality:
    needs: ci-policy
    if: ${{ !cancelled() && needs.ci-policy.outputs.run_checks != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        working-directory: .
        run: rustup toolchain install
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run hermetic tests
        run: cargo test --locked
      - name: Check CLI reference
        run: cargo run --locked --example generate_cli_docs -- --check
      - name: Check embedded schemas
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          for schema in index manifest erratum selector catalog; do
            diff "spec/schema/${schema}-v1.schema.json" \
              "packages/cli/assets/${schema}-v1.schema.json"
          done
          for version in 2 3 4; do
            for schema in index manifest; do
              diff "spec/schema/${schema}-v${version}.schema.json" \
                "packages/cli/assets/${schema}-v${version}.schema.json"
            done
          done

  quality:
    needs: ci-policy
    if: ${{ !cancelled() && needs.ci-policy.outputs.run_checks != 'false' }}
    name: Python quality (${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    defaults:
      run:
        working-directory: packages/python
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/python
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Check Python binding formatting
        run: cargo fmt --check
      - name: Lint Python bindings
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Check formatting
        run: uv run ruff format --check . ../../tools ../../curation
      - name: Lint
        run: uv run ruff check . ../../tools ../../curation
      - name: Type check
        run: uv run mypy
      - name: Run hermetic tests
        run: uv run pytest
      - name: Check generated registry
        run: |
          uv run python ../../tools/dm_index.py check
          uv run python ../../tools/dm_index.py check \
            tests/registry/releases/test-0001/release.yaml
          uv run python ../../tools/dm_index.py check \
            tests/registry/releases/test-0002/release.yaml
      - name: Check Versionary registry snapshot
        env:
          REGISTRY_RELEASE_PR: ${{ startsWith(github.head_ref, 'versionary/release-registry-') }}
        run: |
          flags=()
          if [[ "$REGISTRY_RELEASE_PR" == true ]]; then
            flags+=(--pending)
          fi
          uv run python ../../tools/dm_registry_release.py check "${flags[@]}"
      - name: Check client registry bundles
        run: uv run python ../../tools/dm_bundle_registry.py --check
      - name: Build package
        run: uv build

  r-quality:
    needs: [ci-policy, python-distribution-changes]
    if: ${{ !cancelled() && (needs.ci-policy.outputs.run_checks != 'false' || needs.python-distribution-changes.outputs.r_vendor_changed != 'false') }}
    name: R quality (${{ matrix.config.os }}, ${{ matrix.config.r }})
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      # Release PRs need one build when they change the adapter or vendor archive.
      matrix: >-
        ${{ fromJSON(needs.ci-policy.outputs.run_checks == 'false'
          && '{"config":[{"os":"ubuntu-latest","r":"release"}]}'
          || '{"config":[{"os":"macos-latest","r":"release"},{"os":"windows-latest","r":"release"},{"os":"windows-latest","r":"devel","rust":"stable"},{"os":"ubuntu-latest","r":"devel","http-user-agent":"release"},{"os":"ubuntu-latest","r":"release"},{"os":"ubuntu-latest","r":"oldrel-1"}]}') }}
    defaults:
      run:
        working-directory: packages/r
    env:
      R_KEEP_PKG_SOURCE: "yes"
      _R_CHECK_CRAN_INCOMING_REMOTE_: "false"
      CARGO_NET_OFFLINE: "true"
      RUSTUP_TOOLCHAIN: ${{ matrix.config.rust || '1.82.0' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.config.rust || '1.82.0' }}
          components: rustfmt, clippy
          targets: ${{ runner.os == 'Windows' && 'x86_64-pc-windows-gnu' || '' }}
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true
      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: packages/r
          extra-packages: |
            any::rcmdcheck
            any::pkgbuild
          needs: check
      - name: Check shared fixture copies
        run: diff -r ../../tests/conformance tests/testthat/fixtures/conformance
        shell: bash
      - name: Check vendored Rust sources
        working-directory: .
        run: python tools/dm_rust_sources.py --check
      - name: Check R package
        uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: packages/r
          error-on: '"warning"'
          upload-snapshots: true
      - name: Check Rust adapter
        if: matrix.config.os == 'ubuntu-latest' && matrix.config.r == 'release'
        env:
          CARGO_NET_OFFLINE: "false"
        run: |
          cargo fmt --manifest-path src/rust/Cargo.toml --check
          cargo clippy --manifest-path src/rust/Cargo.toml --locked --all-targets -- -D warnings
      - name: Test R adapter against local core
        env:
          CARGO_NET_OFFLINE: "false"
        run: python ../../tools/dm_r_local.py -e 'pkgbuild::compile_dll(".", debug = TRUE, force = TRUE); testthat::test_local(".")'

  julia-distributions:
    needs: ci-policy
    if: ${{ !cancelled() && needs.ci-policy.outputs.run_checks != 'false' }}
    uses: ./.github/workflows/julia-native.yml
