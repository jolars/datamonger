name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-distributions:
    uses: ./.github/workflows/python-wheels.yml

  core-quality:
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: ["1.82.0", stable]
    defaults:
      run:
        working-directory: crates/datamonger-core
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/datamonger-core
      - name: Check vendored Rust sources and fixtures
        working-directory: .
        run: python tools/dm_rust_sources.py --check
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - name: Check C ABI crate
        working-directory: crates/datamonger-ffi
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Verify standalone crate package
        run: cargo package --locked

  cli-quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/cli
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        working-directory: .
        run: rustup toolchain install
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run hermetic tests
        run: cargo test --locked
      - name: Check CLI reference
        run: cargo run --locked --example generate_cli_docs -- --check
      - name: Check embedded schemas
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          for schema in index manifest erratum selector catalog; do
            diff "spec/schema/${schema}-v1.schema.json" \
              "packages/cli/assets/${schema}-v1.schema.json"
          done
          for version in 2 3; do
            for schema in index manifest; do
              diff "spec/schema/${schema}-v${version}.schema.json" \
                "packages/cli/assets/${schema}-v${version}.schema.json"
            done
          done

  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/python
    env:
      UV_PYTHON: "3.11"
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/python
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Check Python binding formatting
        run: cargo fmt --check
      - name: Lint Python bindings
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Check formatting
        run: uv run ruff format --check . ../../tools ../../curation
      - name: Lint
        run: uv run ruff check . ../../tools ../../curation
      - name: Type check
        run: uv run mypy
      - name: Run hermetic tests
        run: uv run pytest
      - name: Check generated registry
        run: |
          uv run python ../../tools/dm_index.py check
          uv run python ../../tools/dm_index.py check \
            tests/registry/releases/test-0001/release.yaml
          uv run python ../../tools/dm_index.py check \
            tests/registry/releases/test-0002/release.yaml
      - name: Check Versionary registry snapshot
        env:
          REGISTRY_RELEASE_PR: ${{ startsWith(github.head_ref, 'versionary/release-registry-') }}
        run: |
          flags=()
          if [[ "$REGISTRY_RELEASE_PR" == true ]]; then
            flags+=(--pending)
          fi
          uv run python ../../tools/dm_registry_release.py check "${flags[@]}"
      - name: Check client registry bundles
        run: uv run python ../../tools/dm_bundle_registry.py --check
      - name: Build package
        run: uv build

  r-quality:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: packages/r
    env:
      R_KEEP_PKG_SOURCE: "yes"
      _R_CHECK_CRAN_INCOMING_REMOTE_: "false"
      CARGO_NET_OFFLINE: "true"
      RUSTUP_TOOLCHAIN: "1.82.0"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.82.0"
          targets: ${{ runner.os == 'Windows' && 'x86_64-pc-windows-gnu' || '' }}
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: packages/r
      - name: Check shared fixture copies
        run: diff -r ../../tests/conformance tests/testthat/fixtures/conformance
        shell: bash
      - name: Check vendored Rust sources
        working-directory: .
        run: python tools/dm_rust_sources.py --check
      - name: Build R package
        run: R CMD build .
        shell: bash
      - name: Check R package
        run: R CMD check --no-manual --as-cran datamonger_*.tar.gz
        shell: bash
      - name: Test R adapter against local core
        env:
          DM_R_CORE_PATH: ${{ github.workspace }}/crates/datamonger-core
          CARGO_NET_OFFLINE: "false"
          DEBUG: "1"
        run: Rscript -e 'pkgbuild::compile_dll(".", debug = TRUE, force = TRUE); testthat::test_local(".")'

  julia-distributions:
    uses: ./.github/workflows/julia-native.yml
