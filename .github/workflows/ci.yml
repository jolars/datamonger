name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/python
    env:
      UV_PYTHON: "3.11"
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Check formatting
        run: uv run ruff format --check . ../../tools
      - name: Lint
        run: uv run ruff check . ../../tools
      - name: Type check
        run: uv run mypy
      - name: Run hermetic tests
        run: uv run pytest
      - name: Check generated registry
        run: |
          uv run python ../../tools/dm_index.py check
          uv run python ../../tools/dm_index.py check \
            tests/registry/releases/test-0001/release.yaml
          uv run python ../../tools/dm_index.py check \
            tests/registry/releases/test-0002/release.yaml
      - name: Build package
        run: uv build

  r-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/r
    env:
      R_KEEP_PKG_SOURCE: "yes"
      _R_CHECK_CRAN_INCOMING_REMOTE_: "false"
    steps:
      - uses: actions/checkout@v7
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: packages/r
      - name: Check shared fixture copies
        run: diff -r ../../tests/conformance tests/testthat/fixtures/conformance
      - name: Build R package
        run: R CMD build .
      - name: Check R package
        run: R CMD check --no-manual --as-cran datamonger_*.tar.gz

  julia-quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        julia-version: ["1.10", "1"]
    defaults:
      run:
        working-directory: packages/julia
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia-version }}
      - name: Check shared fixture copies
        run: diff -r ../../tests/conformance test/fixtures/conformance
      - name: Run hermetic tests
        run: julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.test()'
