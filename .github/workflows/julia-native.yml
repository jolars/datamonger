name: Julia package

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          [
            ubuntu-latest,
            ubuntu-24.04-arm,
            macos-15-intel,
            macos-latest,
            windows-latest,
          ]
        julia: ["1"]
        include:
          - os: ubuntu-latest
            julia: "1.10"
    env:
      JULIA_PKG_USE_CLI_GIT: "true"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia }}
      - name: Check shared fixtures
        run: diff -r tests/conformance packages/julia/test/fixtures/conformance
      - name: Test with the published JLL outside the checkout
        run: |
          unset DM_JULIA_CORE_LIBRARY
          cp -R packages/julia "$RUNNER_TEMP/Datamonger"
          cd "$RUNNER_TEMP"
          julia --project=Datamonger -e 'using Pkg; Pkg.instantiate(); Pkg.test()'
      - uses: dtolnay/rust-toolchain@master
        if: matrix.os == 'ubuntu-latest' && matrix.julia == '1'
        with:
          toolchain: stable
      - name: Test the checkout's C ABI and Julia bindings
        env:
          DM_REQUIRE_SPARSE_LABEL_JOIN: "true"
        if: matrix.os == 'ubuntu-latest' && matrix.julia == '1'
        run: |
          julia tools/dm_julia_core.jl
          cc -Wall -Wextra -Werror -I crates/datamonger-ffi/include \
            crates/datamonger-ffi/tests/abi.c \
            -L target/release -ldatamonger_ffi \
            -Wl,-rpath,"$PWD/target/release" -o "$RUNNER_TEMP/abi-test"
          "$RUNNER_TEMP/abi-test" tests/conformance/artifacts/small.libsvm
          julia --project=packages/julia -e 'using Pkg; Pkg.instantiate(); Pkg.test()'
