name: Publish registry

on:
  workflow_call:
    inputs:
      tag:
        description: Registry tag already created by Versionary
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Versionary registry tag to finish or verify
        required: true
        type: string

concurrency:
  group: publish-registry-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      UV_PYTHON: "3.11"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          fetch-tags: true

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Validate the tagged snapshot and existing release
        id: metadata
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^registry-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid Versionary registry tag: $RELEASE_TAG" >&2
            exit 1
          fi
          version="${RELEASE_TAG#registry-v}"
          if [[ "$(cat registry/version.txt)" != "$version" ]]; then
            echo "Tag does not match registry/version.txt." >&2
            exit 1
          fi
          release_directory="registry/releases/$version"
          uv run --project packages/python python tools/dm_registry_release.py check --pending
          expected_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/index.json"
          if [[ "$(jq -r .index_url "$release_directory/selector.json")" != "$expected_url" ]]; then
            echo "Selector does not match this repository and release tag." >&2
            exit 1
          fi
          release="$(gh release view "$RELEASE_TAG" --json isDraft,isPrerelease)"
          if [[ "$(jq -r .isPrerelease <<< "$release")" != false ]]; then
            echo "Stable registry publication requires a stable release." >&2
            exit 1
          fi
          echo "directory=$release_directory" >> "$GITHUB_OUTPUT"
          echo "draft=$(jq -r .isDraft <<< "$release")" >> "$GITHUB_OUTPUT"

      - name: Reverify draft inputs against upstream data
        if: steps.metadata.outputs.draft == 'true'
        env:
          RELEASE_DIRECTORY: ${{ steps.metadata.outputs.directory }}
        run: |
          uv run --project packages/python python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import sys
          import yaml

          source = yaml.safe_load(
              (Path(os.environ["RELEASE_DIRECTORY"]) / "release.yaml").read_text()
          )
          for manifest in source["manifests"]:
              subprocess.run(
                  [sys.executable, "tools/dm_add.py", manifest],
                  check=True,
                  stdout=subprocess.DEVNULL,
              )
          PY

      - name: Attach and verify the immutable index
        env:
          RELEASE_DIRECTORY: ${{ steps.metadata.outputs.directory }}
          RELEASE_DRAFT: ${{ steps.metadata.outputs.draft }}
        run: |
          assets="$(gh release view "$RELEASE_TAG" --json assets --jq .assets)"
          if [[ "$(jq length <<< "$assets")" == 0 && "$RELEASE_DRAFT" == true ]]; then
            gh release upload "$RELEASE_TAG" "$RELEASE_DIRECTORY/index.json"
          fi
          assets="$(gh release view "$RELEASE_TAG" --json assets --jq .assets)"
          if [[ "$(jq length <<< "$assets")" != 1 || "$(jq -r '.[0].name' <<< "$assets")" != index.json ]]; then
            echo "Registry release must contain index.json as its sole asset." >&2
            exit 1
          fi
          download_directory="$(mktemp -d "$RUNNER_TEMP/registry-release.XXXXXX")"
          gh release download "$RELEASE_TAG" --pattern index.json --dir "$download_directory"
          expected_sha="$(jq -r .index_sha256 "$RELEASE_DIRECTORY/selector.json")"
          actual_sha="$(sha256sum "$download_directory/index.json" | cut -d ' ' -f 1)"
          if [[ "$actual_sha" != "$expected_sha" ]]; then
            echo "Uploaded index digest does not match selector.json." >&2
            exit 1
          fi

      - name: Publish the verified draft
        if: steps.metadata.outputs.draft == 'true'
        run: gh release edit "$RELEASE_TAG" --draft=false --latest=false

      - name: Verify the published selector and upstream data
        id: canary
        env:
          RELEASE_DIRECTORY: ${{ steps.metadata.outputs.directory }}
        run: |
          uv run --project packages/python python tools/dm_canary.py \
            "$RELEASE_DIRECTORY/selector.json" | tee "$RUNNER_TEMP/dm-canary.md"

      - name: Publish canary summary
        if: always() && steps.canary.outcome != 'skipped'
        run: cat "$RUNNER_TEMP/dm-canary.md" >> "$GITHUB_STEP_SUMMARY"
