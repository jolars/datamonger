name: Publish Rust core

on:
  release:
    types: [published]

concurrency:
  group: publish-core-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: startsWith(github.event.release.tag_name, 'datamonger-core-v')
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://crates.io/crates/datamonger-core
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      RUSTUP_TOOLCHAIN: "1.82.0"
    defaults:
      run:
        working-directory: crates/datamonger-core
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Match crate and tag versions
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          package = tomllib.loads(Path("Cargo.toml").read_text())["package"]
          expected = f"{package['name']}-v{package['version']}"
          if os.environ["RELEASE_TAG"] != expected:
              raise SystemExit(f"Expected release tag {expected}")
          PY

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.82.0"

      - name: Test crate
        run: cargo test --locked

      - name: Verify crate publication
        run: cargo publish --locked --dry-run

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish crate
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
