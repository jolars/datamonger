name: Prepare R release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Versionary draft tag, such as datamonger-r-v0.1.0
        required: true
        type: string

concurrency:
  group: prepare-r-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      R_KEEP_PKG_SOURCE: "yes"
      _R_CHECK_CRAN_INCOMING_REMOTE_: "false"
    steps:
      - name: Validate draft release
        run: |
          if [[ "$RELEASE_TAG" != datamonger-r-v* ]]; then
            echo "Expected a datamonger-r-v* release tag." >&2
            exit 1
          fi
          if [[ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" != true ]]; then
            echo "Release $RELEASE_TAG is not a draft." >&2
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag }}

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-tinytex@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: packages/r

      - name: Match package and tag versions
        run: |
          package_version="$(sed -n 's/^Version:[[:space:]]*//p' packages/r/DESCRIPTION)"
          tag_version="${RELEASE_TAG#datamonger-r-v}"
          if [[ "$package_version" != "$tag_version" ]]; then
            echo "DESCRIPTION has $package_version, but the tag has $tag_version." >&2
            exit 1
          fi

      - name: Build source package
        working-directory: packages/r
        run: R CMD build .

      - name: Run CRAN-style checks
        working-directory: packages/r
        run: R CMD check --as-cran datamonger_*.tar.gz

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.release_tag }}-source
          path: packages/r/datamonger_*.tar.gz
          if-no-files-found: error

      - name: Attach source package to draft
        run: gh release upload "$RELEASE_TAG" packages/r/datamonger_*.tar.gz --clobber
