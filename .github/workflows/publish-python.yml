name: Publish Python

on:
  release:
    types: [published]

concurrency:
  group: publish-python-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    if: startsWith(github.event.release.tag_name, 'datamonger-python-v')
    uses: ./.github/workflows/python-wheels.yml
    with:
      ref: ${{ github.event.release.tag_name }}
    permissions:
      contents: read

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/datamonger
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: python-*
          merge-multiple: true
          path: dist/

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
