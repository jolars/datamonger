version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    # Cargo-dist must generate this workflow with matching action versions.
    exclude-paths:
      - .github/workflows/release.yml
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  - package-ecosystem: cargo
    directory: /
    exclude-paths:
      - packages/r/src/rust/**
    # The R adapter requires a coordinated lockfile and vendor archive refresh.
    # Update it with `task r:vendor` instead.
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      rust:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: uv
    directory: /packages/python
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      python:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /documentation
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
    groups:
      documentation:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

# Dependabot does not support R, Julia, or Nix dependency updates.
