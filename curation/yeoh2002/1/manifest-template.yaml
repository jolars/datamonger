schema_version: 5
source: datamonger
name: yeoh2002
version: '1'
title: Gene expression and pediatric acute lymphoblastic leukemia subtype
description: >-
  Processed Affymetrix HG-U95Av2 expression values for 248 diagnostic bone
  marrow samples in six acute lymphoblastic leukemia subtypes. The portable
  representation retains 12,625 probe sets, sample identifiers, and subtype
  labels from Bioconductor's stjudem data package.
modality: tabular
preprocessing:
  upstream:
    status: documented
    evidence:
    - https://mirrors.nju.edu.cn/bioconductor/packages/3.5/data/experiment/html/stjudem.html
    steps:
    - kind: normalization
      description: The package applies variance-stabilizing normalization at probe level.
      parameters:
        method: vsn
    - kind: aggregation
      description: The package summarizes normalized probes into probe-set expression.
      parameters:
        method: median polish
  datamonger:
    status: documented
    evidence:
    - curation/yeoh2002/1/DATASET.md
    - curation/yeoh2002/1/convert.R
    steps:
    - kind: sample-selection
      description: Select the six labeled subtypes that define Iowa's measured cohort.
      parameters:
        labels: BCR, E2A, Hyperdip, MLL, T, TEL
    notes: >-
      Export samples as rows with source IDs and probe names. Preserve precision,
      labels, and order without further normalization or imputation.
