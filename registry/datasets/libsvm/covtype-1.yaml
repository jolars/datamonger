schema_version: 5
source: libsvm
name: covtype
version: '1'
title: Covertype
description: LIBSVM's unscaled, seven-class representation of UCI Covertype. The 54 cartographic
  features describe 30-meter cells in Colorado's Roosevelt National Forest. Labels 1 through
  7 denote spruce/fir, lodgepole pine, ponderosa pine, cottonwood/willow, aspen, Douglas-fir,
  and krummholz, respectively.
modality: tabular
preprocessing:
  upstream:
    status: documented
    evidence:
    - https://www.csie.ntu.edu.tw/~cjlin/libsvmtools/datasets/multiclass.html#covtype
    - https://archive.ics.uci.edu/ml/machine-learning-databases/covtype/covtype.info
    - https://archive.ics.uci.edu/ml/machine-learning-databases/covtype/covtype.data.gz
    steps:
    - kind: feature-encoding
      description: UCI represents wilderness area and soil type with four and 40 binary indicator
        columns, respectively.
    notes: A row-by-row comparison with the original UCI data confirmed the unscaled feature
      values, seven class labels, and source row order. LIBSVM provides one complete file.
  datamonger:
    status: none
    evidence:
    - spec/decoders/libsvm-v1.md
