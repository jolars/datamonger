schema_version: 1
source: libsvm
name: rcv1-binary
version: '1'
title: RCV1 Binary
description: LIBSVM's binary classification variant of Reuters Corpus Volume 1, with 47,236
  sparse text features and predefined training and test sets. Positive labels combine CCAT
  and ECAT, and negative labels combine GCAT and MCAT. Documents assigned to both groups are
  removed. The provider's feature values, labels, splits, and row order are preserved.
modality: tabular
provenance:
  provider: LIBSVM
  upstream_name: rcv1.binary
  landing_page: https://www.csie.ntu.edu.tw/~cjlin/libsvmtools/datasets/binary.html#rcv1.binary
  authors:
  - David D. Lewis
  - Yiming Yang
  - Tony G. Rose
  - Fan Li
  citation: 'David D. Lewis, Yiming Yang, Tony G. Rose, and Fan Li. RCV1: A New Benchmark
    Collection for Text Categorization Research. Journal of Machine Learning Research, 5:361-397,
    2004. https://www.jmlr.org/papers/v5/lewis04a.html'
  retrieved_at: '2026-10-19'
license:
  status: unknown
  url: https://trec.nist.gov/data/reuters/reuters.html
  evidence: The LIBSVM dataset page documents the source and binary label mapping but provides
    no license terms for these artifacts. NIST identifies Reuters copyright and organizational
    and individual agreements for the source corpus. No license or redistribution grant has
    been established for the LIBSVM transformation.
