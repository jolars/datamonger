schema_version: 5
source: libsvm
name: real-sim
version: '1'
title: Real vs. Simulated
description: >-
  LIBSVM's binary text classification dataset for real versus simulated auto
  and aviation discussions, prepared from Andrew McCallum's SRAA UseNet
  collection by Vikas Sindhwani for SVMlin. It contains 72,309 articles and
  20,958 sparse features. Its numeric labels are -1 and 1, and 108 articles
  have no stored features. The provider supplies one artifact without a
  predefined training and test split. Feature values, labels, and source row
  order are preserved.
modality: tabular
preprocessing:
  upstream:
    status: unknown
    evidence:
    - https://www.csie.ntu.edu.tw/~cjlin/libsvmtools/datasets/binary.html#real-sim
    - https://people.cs.umass.edu/~mccallum/data.html
    - https://vikas.sindhwani.org/svmlin.html
    notes: LIBSVM credits Vikas Sindhwani with preprocessing for SVMlin, but does not describe
      the text feature extraction, weighting, normalization, sample selection, or mapping
      of the two classes to numeric labels. McCallum describes 73,218 original SRAA articles,
      whereas the prepared real-sim artifact has 72,309 rows; the selection rule is not established.
  datamonger:
    status: none
    evidence:
    - spec/decoders/libsvm-v1.md
    notes: Datamonger decodes the provider artifact without additional statistical preprocessing.
provenance:
  provider: LIBSVM
  upstream_name: real-sim
  landing_page: https://www.csie.ntu.edu.tw/~cjlin/libsvmtools/datasets/binary.html#real-sim
  authors:
