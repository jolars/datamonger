  - Vikas Sindhwani
  citation: 'Andrew McCallum. SRAA: Simulated/Real/Aviation/Auto UseNet data. https://people.cs.umass.edu/~mccallum/data.html.
    Prepared by Vikas Sindhwani for SVMlin, https://vikas.sindhwani.org/svmlin.html. Chih-Chung
    Chang and Chih-Jen Lin. LIBSVM: A Library for Support Vector Machines. ACM Transactions
    on Intelligent Systems and Technology, 2:27:1-27:27, 2011. https://www.csie.ntu.edu.tw/~cjlin/libsvm/.'
  retrieved_at: '2026-11-09'
license:
