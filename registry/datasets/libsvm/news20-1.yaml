schema_version: 5
source: libsvm
name: news20
version: '1'
title: News20
description: >-
  LIBSVM's multiclass 20 Newsgroups dataset represents Usenet posts as sparse
  text features and labels them by newsgroup. The original training and test files share 62,061
  feature columns. Feature values, labels, split membership, and row order are preserved.
modality: tabular
preprocessing:
  upstream:
    status: documented
    evidence:
    - https://www.csie.ntu.edu.tw/~cjlin/libsvmtools/datasets/multiclass.html#news20
    steps:
    - kind: train-test-split
      description: Use the provider's first 80/20 training and test split.
    notes: >-
      This entry uses LIBSVM's base files. The provider does not describe the full
      text feature extraction procedure or map numeric labels to newsgroup names.
  datamonger:
    status: none
    evidence:
    - spec/decoders/libsvm-v1.md
    notes: Datamonger decodes the upstream files without additional preprocessing.
provenance:
  provider: LIBSVM
  upstream_name: news20
  landing_page: https://www.csie.ntu.edu.tw/~cjlin/libsvmtools/datasets/multiclass.html#news20
  authors:
  - Ken Lang
  citation: >-
    Ken Lang. NewsWeeder: Learning to Filter Netnews. Proceedings of the Twelfth
    International Conference on Machine Learning, pp. 331–339, 1995. https://doi.org/10.1016/B978-1-55860-377-6.50048-7
  retrieved_at: '2026-11-20'
license:
  status: unknown
  url: https://www.csie.ntu.edu.tw/~cjlin/libsvmtools/datasets/multiclass.html#news20
  evidence: >-
    LIBSVM gives no license terms for these files. UCI lists CC BY 4.0 for its own
    Twenty Newsgroups deposit (https://doi.org/10.24432/C5C323). The applicability of those
    terms to these LIBSVM artifacts has not been established.
