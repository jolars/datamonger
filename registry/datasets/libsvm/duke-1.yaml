schema_version: 5
source: libsvm
name: duke
version: '1'
title: Duke Breast Cancer
description: 'Normalized gene expression profiles from human breast tumors for binary classification
  of estrogen receptor status. LIBSVM provides a 44-row dataset and a benchmark with 38 training
  and four validation rows drawn from it.

  '
modality: tabular
preprocessing:
  upstream:
    status: documented
    evidence:
    - https://www.csie.ntu.edu.tw/~cjlin/libsvmtools/datasets/binary.html#duke%20breast-cancer
    steps:
    - kind: sample-selection
      description: Five of the original 49 samples had discordant receptor status across two
        assays and were omitted from the full LIBSVM file.
    - kind: normalization
      description: Normalize each sample to mean zero and variance one.
      parameters:
        axis: rows
        mean: '0'
        variance: '1'
    - kind: normalization
      description: Then normalize each feature to mean zero and variance one.
      parameters:
        axis: columns
        mean: '0'
        variance: '1'
    notes: LIBSVM reports two additional exclusions for failed array hybridization before
      the benchmark split. The full file includes two rows outside both benchmark partitions.
  datamonger:
    status: none
    evidence:
    - spec/decoders/named-splits-v1.md
    - spec/decoders/libsvm-v1.md
provenance:
  provider: LIBSVM
  upstream_name: duke breast-cancer
  landing_page: https://www.csie.ntu.edu.tw/~cjlin/libsvmtools/datasets/binary.html#duke%20breast-cancer
  authors:
  - Mike West
  - Carrie Blanchette
  - Holly Dressman
  - Erich Huang
  - Seiichi Ishida
  - Rainer Spang
  - Harry Zuzan
  - John A. Olson Jr.
  - Jeffrey R. Marks
  - Joseph R. Nevins
  citations:
  - citation: West et al. (2001). Predicting the clinical status of human breast cancer by
      using gene expression profiles. PNAS 98(20), 11462–11467. https://doi.org/10.1073/pnas.201162998.
    role: paper
  - citation: Shevade and Keerthi (2003). A simple and efficient algorithm for gene selection
      using sparse logistic regression. Bioinformatics 19(17), 2246–2253.
    role: paper
    note: LIBSVM cites this paper for preprocessing and the benchmark split.
  retrieved_at: '2026-11-18'
license:
  status: unknown
  evidence: 'The LIBSVM catalog provides downloads without dataset-specific license terms.
    The original article carries a National Academy of Sciences copyright notice and does
    not establish a license for the LIBSVM files.

    '
