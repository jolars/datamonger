schema_version: 5
source: libsvm
name: yearpredictionmsd
version: '1'
title: Year Prediction MSD
description: 'Song release-year regression data from the Million Song Dataset, distributed
  by LIBSVM with 90 audio features: 12 timbre averages and 78 timbre covariances. The predefined
  training and test sets contain 463715 and 51630 songs, respectively, with no artist shared
  between the splits.'
modality: tabular
preprocessing:
  upstream:
    status: documented
    evidence:
    - https://archive.ics.uci.edu/dataset/203/yearpredictionmsd
    - https://www.csie.ntu.edu.tw/~cjlin/libsvmtools/datasets/regression.html#YearPredictionMSD
    steps:
    - kind: aggregation
      description: Compute averages and covariances of 12-dimensional Echo Nest timbre vectors
        over each song's segments, producing 12 average features and 78 covariance features.
    - kind: split-selection
      description: Use the first 463715 examples for training and the last 51630 for testing
        so that no artist appears in both splits.
    notes: Any additional processing used to prepare LIBSVM's feature values has not been
      established.
  datamonger:
    status: none
    evidence:
    - spec/decoders/libsvm-v2.md
    notes: The LIBSVM v2 decoder omits explicitly stored zeros without changing feature values.
      Datamonger applies no statistical preprocessing.
provenance:
  provider: LIBSVM
  upstream_name: YearPredictionMSD
  landing_page: https://www.csie.ntu.edu.tw/~cjlin/libsvmtools/datasets/regression.html#YearPredictionMSD
  authors:
