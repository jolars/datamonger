schema_version: 4
source: libsvm
name: a7a
version: '1'
title: Adult (a7a)
description: The a7a binary classification variant of the UCI Adult census income dataset,
  distributed by LIBSVM with predefined training and test artifacts. The task predicts whether
  annual income exceeds $50,000 using 123 binary features derived from the original 14 attributes.
modality: tabular
preprocessing:
  upstream:
    status: documented
    evidence:
    - https://www.csie.ntu.edu.tw/~cjlin/libsvmtools/datasets/binary.html#a7a
    - https://www.csie.ntu.edu.tw/~cjlin/libsvmtools/datasets/binary.html#a1a
    steps:
    - kind: feature-encoding
      description: The six continuous Adult attributes are discretized into quantiles and
        represented by binary indicators. Each category of the eight categorical attributes
        is represented by a binary indicator.
    notes: LIBSVM documents 123 features and the training and test sizes. The quantile boundaries,
      fitting population, handling of original missing values, and split selection procedure
      have not been established.
  datamonger:
    status: none
    evidence:
    - spec/decoders/libsvm-v1.md
    notes: Datamonger decodes the provider artifacts without additional statistical preprocessing.
provenance:
  provider: LIBSVM
  upstream_name: a7a
  landing_page: https://www.csie.ntu.edu.tw/~cjlin/libsvmtools/datasets/binary.html#a7a
  authors:
  - Barry Becker
  - Ronny Kohavi
  citations:
  - citation: Becker, B., and Kohavi, R. (1996). Adult [Dataset]. UCI Machine Learning Repository.
      https://doi.org/10.24432/C5XW20.
    role: dataset
    note: Original Adult dataset, as cited by UCI.
  - citation: John C. Platt. Fast training of support vector machines using sequential minimal
      optimization. In Advances in Kernel Methods - Support Vector Learning. MIT Press, 1998.
    role: paper
    note: 'Reference JP98a associated with these variants by LIBSVM: https://www.csie.ntu.edu.tw/~cjlin/libsvmtools/datasets/ref.html#JP98a.'
  retrieved_at: '2026-10-26'
license:
  status: unknown
  evidence: 'UCI identifies Barry Becker and Ronny Kohavi as the Adult dataset creators and
    licenses the original dataset under CC BY 4.0: https://archive.ics.uci.edu/dataset/2/adult.
    The LIBSVM page identifies Adult as the source and documents its feature encoding but
    states no license terms for the transformed artifacts: https://www.csie.ntu.edu.tw/~cjlin/libsvmtools/datasets/binary.html#a7a.
    The applicability of the original license to these distributed artifacts has not been
    established.'
