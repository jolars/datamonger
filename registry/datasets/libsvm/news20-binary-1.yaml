schema_version: 3
source: libsvm
name: news20-binary
version: '1'
title: News20 Binary
description: LIBSVM's binary classification variant of 20 Newsgroups, with 19,996 documents
  and 1,355,191 sparse text features. Nonzero feature vectors have approximately unit length;
  42 documents have no stored features. The provider supplies a single artifact without a
  predefined training and test split. Feature values, binary labels, and row order are preserved.
modality: tabular
preprocessing:
  upstream:
    status: documented
    evidence:
    - https://www.csie.ntu.edu.tw/~cjlin/libsvmtools/datasets/binary.html#news20.binary
    steps:
    - kind: normalization
      description: Normalize each document's feature vector to unit length.
      parameters:
        axis: rows
        norm: l2
    notes: The provider page does not describe the earlier text feature preparation or the
      mapping from newsgroups to the two labels. Artifact inspection finds 42 zero-feature
      documents; nonzero vectors have unit length within the precision of the stored values.
  datamonger:
    status: none
    evidence:
    - spec/decoders/libsvm-v1.md
    notes: Datamonger decodes the provider artifact without additional statistical preprocessing.
provenance:
  provider: LIBSVM
  upstream_name: news20.binary
