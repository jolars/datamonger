schema_version: 5
source: libsvm
name: covtype-binary
version: '1'
title: Covertype Binary
description: The unscaled binary classification variant of UCI Covertype, distributed by LIBSVM
  as one file. The 54 cartographic features describe 30-meter cells in Colorado's Roosevelt
  National Forest. Response label 2 denotes lodgepole pine, and label 1 combines the six other
  cover types.
modality: tabular
preprocessing:
  upstream:
    status: documented
    evidence:
    - https://www.csie.ntu.edu.tw/~cjlin/libsvmtools/datasets/binary.html#covtype.binary
    - https://doi.org/10.1162/089976602753633402
    - https://archive.ics.uci.edu/dataset/31/covertype
    steps:
    - kind: response-dichotomization
      description: Keep lodgepole pine as its own class and group the other six cover types.
      parameters:
        lodgepole_pine_label: '2'
        other_cover_types_label: '1'
    notes: A row-by-row comparison with the original UCI data confirmed the label mapping,
      unscaled feature values, and source row order.
  datamonger:
    status: none
    evidence:
    - spec/decoders/libsvm-v1.md
provenance:
  provider: LIBSVM
  upstream_name: covtype.binary
  landing_page: https://www.csie.ntu.edu.tw/~cjlin/libsvmtools/datasets/binary.html#covtype.binary
  authors:
  - Jock Blackard
  citations:
  - citation: Blackard, J. (1998). Covertype [Dataset]. UCI Machine Learning Repository. https://doi.org/10.24432/C50K5N.
    role: dataset
  - citation: Collobert, R., Bengio, S., and Bengio, Y. (2002). A parallel mixture of SVMs
      for very large scale problems. Neural Computation, 14(5), 1105-1114. https://doi.org/10.1162/089976602753633402.
    role: paper
    note: LIBSVM reference RC02a describes the binary classification task.
  citation_instructions: Retain the copyright notice for Jock A. Blackard and Colorado State
    University, as requested in covtype.info.
  retrieved_at: '2026-11-18'
license:
  status: unknown
  evidence: UCI lists CC BY 4.0 for the original Covertype dataset (https://archive.ics.uci.edu/dataset/31/covertype).
    The source documentation permits reuse with retention of the original copyright notice
    (https://archive.ics.uci.edu/ml/machine-learning-databases/covtype/covtype.info). License
    terms for the LIBSVM binary artifact are unverified.
