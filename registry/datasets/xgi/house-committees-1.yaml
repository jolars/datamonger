      clustering: From blockmodels to modularity. Science Advances, 7(28), eabh1303.
      https://doi.org/10.1126/sciadv.abh1303'
  - role: dataset
    citation: 'Stewart, C., III, and Woon, J. Congressional Committee Assignments, 103rd to
