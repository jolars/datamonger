schema_version: 5
source: lars
name: diabetes
version: '1'
title: Diabetes
description: Baseline measurements for 442 diabetes patients and a quantitative measure of
  disease progression one year later, from Efron et al. (2004). This is the original, unstandardized
  ten-predictor TSV distributed by NC State, rather than the standardized lars representation
  used in the SLOPE paper examples. S1 through S6 are serum measurements. No predefined train/test
  split is supplied. Centering and scaling this file does not exactly reproduce the
  paper export because BP and S5 differ slightly in precision. All response values and row
  order agree.
modality: tabular
preprocessing:
  upstream:
    status: unknown
    evidence:
    - https://www4.stat.ncsu.edu/~boos/var.select/diabetes.html
    notes: The provider identifies this as the original data and distinguishes it from the
      standardized lars export. Earlier measurement preparation is not fully documented; unstandardized
      does not imply unprocessed.
  datamonger:
    status: none
    evidence:
    - spec/decoders/delimited-text-v1.md
    notes: Datamonger decodes the upstream TSV without scaling or other statistical preprocessing.
provenance:
