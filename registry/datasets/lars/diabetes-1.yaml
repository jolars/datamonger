  citation: Efron, B., Hastie, T., Johnstone, I., and Tibshirani, R. (2004). Least Angle Regression.
    The Annals of Statistics, 32(2), 407–499. https://doi.org/10.1214/009053604000000067.
  retrieved_at: '2026-11-08'
license:
