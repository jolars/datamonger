schema_version: 5
source: uci
name: covertype
version: '1'
title: Covertype
description: Forest cover types for 581,012 cells measuring 30 by 30 meters in four wilderness
  areas of the Roosevelt National Forest in northern Colorado. The 54 cartographic features
  comprise 10 quantitative measurements, four binary wilderness indicators, and 40 binary
  soil-type indicators. Cover_Type codes 1 through 7 denote spruce/fir, lodgepole pine, ponderosa
  pine, cottonwood/willow, aspen, Douglas-fir, and krummholz, respectively.
modality: tabular
preprocessing:
  upstream:
    status: documented
    evidence:
    - https://archive.ics.uci.edu/dataset/31/covertype
    - https://archive.ics.uci.edu/ml/machine-learning-databases/covtype/covtype.info
    steps:
    - kind: feature-encoding
      description: The provider represents wilderness area and soil type using four and 40
        binary indicator columns, respectively.
      parameters:
        wilderness_columns: Wilderness_Area1 through Wilderness_Area4
        soil_columns: Soil_Type1 through Soil_Type40
        absence: '0'
        presence: '1'
    notes: The provider documents unscaled data with no missing values. The original study
      used the first 11,340 records for training, the next 3,780 for validation, and the last
      565,892 for testing. The upstream CSV contains the full table; this entry retains its
      source order and does not materialize separate split artifacts.
  datamonger:
    status: none
    evidence:
    - spec/decoders/delimited-text-v1.md
    notes: Datamonger decodes the provider artifact without additional statistical preprocessing.
