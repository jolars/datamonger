schema_version: 5
source: datamonger
name: guyon2004-gisette
version: '2'
title: 'Gisette: original challenge feature values'
description: Digit 4-versus-9 classification data from the NIPS 2003 feature selection challenge,
  prepared from UCI without further scaling. Preserves 6,000 labeled training rows, 1,000
  labeled validation rows, and 6,500 unlabeled test rows with 5,000 features. Training and
  validation retain original -1/+1 labels and sparse storage; test features are a dense table
  with positional columns x1 through x5000. Feature identities and label-to-digit mappings
  are not established.
modality: tabular
preprocessing:
  upstream:
    status: documented
    evidence:
    - https://archive.ics.uci.edu/dataset/170/gisette
    steps:
    - kind: feature-encoding
      description: The producers normalize and center digit images, sample pixels, construct
        pixel products, add distractor probes, and randomize feature and example order.
    notes: These are prepared challenge features, not raw images. The UCI integers range from
      0 to 999. No LIBSVM scaling is used.
  datamonger:
    status: none
    evidence:
    - curation/guyon2004-gisette/1/prepare.py
    - curation/guyon2004-gisette/1/DATASET.md
    notes: Only lossless file conversion and gzip compression are applied. Feature values,
      labels, ordering, and source splits are preserved.
provenance:
  provider: Datamonger; derived from UCI Gisette
  upstream_name: Gisette
  upstream_id: '170'
  upstream_version: sha256:430bb631b3e494659f13763c117f06f5aa8a269b0d8e13ccf5b71d95303f3808
  landing_page: https://archive.ics.uci.edu/dataset/170/gisette
  authors:
  - Isabelle Guyon
  - Steve Gunn
  - Asa Ben-Hur
  - Gideon Dror
  citations:
  - citation: Guyon, I., Gunn, S., Ben-Hur, A., and Dror, G. (2004). Gisette [Dataset]. UCI
      Machine Learning Repository. https://doi.org/10.24432/C5HP5B.
    role: dataset
  - citation: Guyon, I., Gunn, S., Ben-Hur, A., and Dror, G. (2004). Result Analysis of the
      NIPS 2003 Feature Selection Challenge. Advances in Neural Information Processing Systems
      17. https://proceedings.neurips.cc/paper_files/paper/2004/hash/5e751896e527c862bf67251a474b3819-Abstract.html
    role: paper
  - citation: 'Datamonger portable artifacts, version 1: https://doi.org/10.5281/zenodo.23508592.
      Registry representation version 2 assembles the same files with named splits.'
    role: dataset
  retrieved_at: '2026-11-08'
license:
  status: known
  identifier: CC-BY-4.0
  url: https://creativecommons.org/licenses/by/4.0/
  evidence: The UCI Gisette landing page (https://archive.ics.uci.edu/dataset/170/gisette)
    explicitly licenses the dataset under CC BY 4.0. This representation preserves the original
    feature values, available labels, and split membership; it changes file encoding and compression
    only.
  reviewed_by: Codex (automated source review)
  reviewed_at: '2026-11-08'
