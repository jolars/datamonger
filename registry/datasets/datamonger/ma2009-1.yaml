source: datamonger
name: ma2009
version: '1'
title: URL Reputation
description: Anonymized lexical and host-based features from 2,396,130 URLs. The 121 original
  chronological day files share 3,231,961 sparse feature positions. Labels are +1 for malicious
  and -1 for benign. The source supplies no predefined training or test split.
modality: tabular
preprocessing:
  upstream:
    status: documented
    evidence:
    - https://archive.ics.uci.edu/dataset/187/url+reputation
    - https://www.sysnet.ucsd.edu/projects/url/
    - https://icml.cc/Conferences/2009/papers/42.pdf
    steps:
    - kind: feature-encoding
      description: The authors constructed lexical and host-based features, anonymized the
        feature identities, and released a subset of the observations in day files.
  datamonger:
    status: none
    evidence:
    - curation/ma2009/1/prepare.py
    notes: Archive extraction and individual gzip compression preserve day file bytes.
