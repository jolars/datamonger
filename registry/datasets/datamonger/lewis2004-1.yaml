schema_version: 9
source: datamonger
name: lewis2004
version: '1'
title: RCV1-v2 Topics
description: >-
  Multilabel topic classification benchmark from the Reuters English-language newswire
  corpus. The original LYRL2004 split contains 23,149 training documents and 781,265 test
  documents. Both splits use 47,236 weighted term features and the same 103 topic codes.
  Document IDs align with the matrix rows.
modality: tabular
provenance:
  provider: Lewis et al. (JMLR appendices), via the files used by scikit-learn
  upstream_name: RCV1-v2/LYRL2004
  landing_page: https://jmlr.org/papers/v5/lewis04a.html
  authors:
  - David D. Lewis
  - Yiming Yang
  - Tony G. Rose
  - Fan Li
  citations:
  - citation: >-
      Lewis, D. D., Yang, Y., Rose, T. G., and Li, F. (2004). RCV1: A New Benchmark
      Collection for Text Categorization Research. Journal of Machine Learning Research 5,
      361–397. https://jmlr.org/papers/v5/lewis04a.html
    role: paper
  citation_instructions: Acknowledge Reuters as the source corpus provider.
  retrieved_at: '2026-11-27'
license:
  status: unknown
  url: https://jmlr.org/papers/volume5/lewis04a/lewis04a.pdf
  evidence: >-
    Section 7 reports Reuters' permission for the authors to distribute the token and
    vector files without a license agreement. The reviewed sources do not establish
    downstream redistribution terms for these vectors and topic assignments.
preprocessing:
  upstream:
    status: documented
    evidence:
    - https://jmlr.org/papers/volume5/lewis04a/lewis04a.pdf
    steps:
    - kind: feature-extraction
      description: >-
        Use the paper's cosine-normalized log term frequency by inverse document frequency
        weights over stemmed terms with the original chronological split.
  datamonger:
    status: documented
    evidence:
    - spec/decoders.md#sparse-label-join-version-1
    steps:
    - kind: label-encoding
      description: >-
        Join Appendix 8 topics to Appendix 13 vectors by document ID. Encode topic columns
        in lexicographic order and preserve vector order within each shard.
