schema_version: 5
source: datamonger
name: rhee2006
version: '1'
title: 'Rhee2006: Nelfinavir susceptibility and HIV protease mutations'
description: Nelfinavir regression dataset prepared directly from Stanford HIVDB's PI_DATA.txt
  following Iowa Biostatistics' preparation. Contains 842 observations and 361 binary mutation
  indicators in source row order. The response y is the natural logarithm of NFV susceptibility.
  Isolate identifiers and other drug responses are excluded. No missing values remain.
modality: tabular
preprocessing:
  upstream:
    status: unknown
    notes: Stanford supplies protease residue notation and phenotypic drug susceptibility
      values; their earlier measurement preprocessing is not established.
  datamonger:
    status: documented
    evidence:
    - curation/rhee2006/1/DATASET.md
    - curation/rhee2006/1/read_source.R
    steps:
    - kind: sample-selection
      description: Retain rows whose protease positions P1 through P99 contain valid residue
        notation.
    - kind: feature-encoding
      description: Encode each amino acid, insertion, and deletion as a binary residue indicator.
        Mixed residues may activate multiple indicators. Keep mutation-major column order.
    - kind: feature-selection
      description: Remove mutation indicators absent across all valid sequences before selecting
        observed NFV responses.
    - kind: response-transformation
      description: Compute y as the natural logarithm of NFV susceptibility.
      parameters:
        input: NFV
        output: y
        function: log
    - kind: missing-value-removal
      description: Exclude rows without an observed NFV response.
    - kind: feature-selection
      description: Retain the 361 mutation indicators and response y; omit isolate identifiers
        and susceptibility measurements for other drugs.
    notes: Preparation follows the pinned Iowa Biostatistics recipe. CSV serialization preserves
      all prepared binary64 values using 17 significant digits.
