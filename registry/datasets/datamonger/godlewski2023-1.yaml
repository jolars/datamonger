schema_version: 3
source: datamonger
name: godlewski2023
version: '1'
title: Brain tumor plasma metabolomics (Godlewski et al., 2023)
description: 'Lossless CSV conversion of complete Supplementary Table S2: 235 plasma samples,
  138 metabolite measurements, Sample Name identifiers, and the original six Sample type labels
  (glioma grades 1-4, meningioma, and healthy control). Preserves every source value, column
  name, and row and column order. Identifiers are excluded from model features. Contains 94
  glioma samples although the paper reports 95. No SLOPE sample selection or binary label
  mapping is applied. The study authors normalized, filtered, and imputed the measurements
  before publishing the table.'
modality: tabular
preprocessing:
  upstream:
    status: documented
    evidence:
    - https://pmc.ncbi.nlm.nih.gov/articles/PMC10329700/
    - https://www.nature.com/articles/s41598-023-38243-1
    steps:
    - kind: normalization
      description: Authors processed, quantified, and normalized the spectra in MetIDQ according
        to the Biocrates kit manual.
      parameters:
        software: MetIDQ Oxygen DB110-3005
    - kind: missing-value-removal
      description: Authors retained metabolites present in at least 80% of samples, yielding
        138 of 188 measured metabolites.
      parameters:
        axis: columns
        minimum_presence: 80%
    - kind: imputation
      description: Authors substituted missing measurements with half the metabolite's limit
        of detection in each batch.
      parameters:
        method: half limit of detection per batch
    notes: The table is processed metabolomics data, not raw spectra. The paper describes
      further model-specific processing for its experiments; those operations are not reproduced
      here.
  datamonger:
    status: none
    evidence:
    - curation/godlewski2023/1/prepare.py
    - curation/godlewski2023/1/DATASET.md
    notes: Only lossless XLSX-to-CSV conversion and gzip compression. Retains all samples,
      original labels, identifiers, measurements, names, and ordering; no statistical transformations
      are applied.
