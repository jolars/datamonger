[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "datamonger"
version = "0.3.0"
description = "Reproducible retrieval and decoding of public research datasets"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Johan Larsson", email = "johan@jolars.co" }]
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "platformdirs>=4.3",
  "portalocker[win32]>=4.3",
  "scipy>=1.14",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Operating System :: POSIX",
  "Operating System :: Unix",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering",
]

[project.urls]
homepage = "https://datamonger.dev"
tracker = "https://github.com/jolars/datamonger/issues"
repository = "https://github.com/jolars/datamonger"
changelog = "https://github.com/jolars/datamonger/blob/main/packages/python/CHANGELOG.md"

[dependency-groups]
dev = [
  "hypothesis>=6",
  "jsonschema>=4",
  "mypy>=1.14",
  "pandas-stubs>=2.2",
  "pyyaml>=6.0",
  "pytest>=8.3",
  "ruff>=0.16",
  "scipy-stubs>=1.14",
  "types-pyyaml>=6.0",
  "types-jsonschema>=4",
]

[tool.maturin]
module-name = "datamonger._native"
python-source = "src"
locked = true
include = [{ path = "Cargo.lock", format = "sdist" }]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["datamonger"]

[tool.mypy]
strict = true
files = [
  "src/datamonger",
  "tests/typing",
  "../../tools/dm_add.py",
  "../../tools/dm_canary.py",
  "../../tools/dm_index.py",
  "../../tools/dm_registry_release.py",
  "../../tools/dm_bundle_registry.py",
  "../../tools/dm_rust_sources.py",
  "../../tools/dm_ffi_licenses.py",
  "../../tools/dm_catalog.py",
  "../../tools/dm_docs.py",
]

[tool.uv]
default-groups = ["dev"]
