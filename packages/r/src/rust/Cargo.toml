[package]
name = "datamonger-r"
version = "0.0.0"
edition = "2021"
rust-version = "1.82"
publish = false

[lib]
name = "datamonger_r"
crate-type = ["rlib", "staticlib"]

[[bin]]
name = "document"
path = "document.rs"

[dependencies]
# Keep Versionary from advancing this dependency before the core is published
# and the R package's vendor archive is refreshed.
datamonger_core = { package = "datamonger-core", version = "0.1" }
extendr-api = "0.9.0"

[profile.release]
lto = "thin"
codegen-units = 1
