[package]
name = "datamonger"
version = "0.6.0"
edition = "2024"
rust-version = "1.89"
description = "Standalone Datamonger registry and artifact client"
license = "MIT"
repository = "https://github.com/jolars/datamonger"
readme = "README.md"
keywords = ["datasets", "reproducibility", "cli"]
categories = ["command-line-utilities", "science"]
include = ["src/**", "assets/**", "README.md", "LICENSE", "Cargo.toml", "Cargo.lock"]

[[bin]]
name = "datamonger"
path = "src/main.rs"

[dependencies]
anstream = "1"
indicatif = "0.18"
clap = { version = "4", features = ["derive"] }
comfy-table = { version = "8", default-features = false, features = ["custom_styling"] }
dirs = "7"
flate2 = "1"
hex = "0.4"
jsonschema = { version = "0.61", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"

[dev-dependencies]
clapdown = "0.3.0"
