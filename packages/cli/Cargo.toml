[package]
name = "datamonger-cli"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
description = "Standalone Datamonger registry and artifact client"
license = "MIT"
repository = "https://github.com/jolars/datamonger"
readme = "README.md"

[[bin]]
name = "datamonger"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
dirs = "6"
flate2 = "1"
hex = "0.4"
jsonschema = { version = "0.58", default-features = false }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
